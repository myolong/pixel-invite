<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>게임 초대장 - 픽셀 초대장</title>
  <meta name="description" content="픽셀 캐릭터와 미니게임이 들어간 재밌는 초대장. 예시를 보고 바로 만들어요.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="픽셀 초대장">
  <meta property="og:title" content="픽셀 초대장 - 게임을 깨면 열리는 초대장 만들기">
  <meta property="og:description" content="결혼식·모임·행사 초대장을 픽셀 캐릭터와 미니게임으로. 가입 없이 무료.">
  <meta property="og:image" content="https://myolong.github.io/pixel-invite/assets/og/home.png?v=3">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#fff3f5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dongle:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/invite.css?v=20261112a">
  <link rel="stylesheet" href="css/make.css?v=20261112a">
  <link rel="stylesheet" href="css/site.css?v=20261112a">
  <!-- 광고: 초대장을 만드는 사람이 보는 화면에만(손님이 여는 invite*.html에는 넣지 않음) -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5781805498180631" crossorigin="anonymous"></script>
</head>
<body class="maker">
  <header class="mk-head">
    <a class="mk-home" href="index.html">픽셀 초대장</a>
    <span class="mk-beta">무료 베타</span>
  </header>
  <main class="site">
    <a class="back" href="index.html">‹ 초대장 종류 전체</a>
    <div class="kind-page">
      <section class="kind-info">
        <p class="eyebrow" id="kEyebrow"></p>
        <h1 id="kName"></h1>
        <p class="kind-desc" id="kDesc"></p>
        <a class="btn primary big make-btn" id="makeBtn">이 초대장 만들기</a>
        <p class="free-note">가입 없이 무료 · 3분이면 완성</p>

        <h2>이럴 때 좋아요</h2>
        <ul class="points" id="kUses"></ul>

        <h2>들어가는 것</h2>
        <ul class="points" id="kPoints"></ul>

        <h2>미니게임</h2>
        <p id="kGame" class="kind-desc"></p>
      </section>

      <section class="kind-example">
        <p class="ex-label">예시 화면 <small>(눌러서 직접 해 보세요)</small></p>
        <div class="phone"><iframe id="exFrame" title="초대장 예시"></iframe></div>
        <a class="ex-open" id="exOpen" target="_blank" rel="noopener">새 창으로 크게 보기 ›</a>
      </section>
    </div>

    <section class="mk-card">
      <h2>받는 사람에게는 이렇게 보여요</h2>
      <div class="shots" id="shots"></div>
    </section>

    <section class="mk-card">
      <h2>만드는 법</h2>
      <ol class="steps" id="steps"></ol>
      <a class="btn primary big make-btn" id="makeBtn2">지금 만들기</a>
    </section>

    <section class="mk-card">
      <h2>자주 묻는 질문</h2>
      <div class="faq" id="faq"></div>
    </section>

    <section class="others">
      <h2>다른 초대장</h2>
      <div class="other-chips" id="others"></div>
    </section>
  </main>

  <script src="js/invite-code.js?v=20261112a"></script>
  <script src="js/kinds.js?v=20261112a"></script>
  <script>
    'use strict';
    (async function () {
      const { KINDS, ORDER } = InviteKinds;
      const q = new URLSearchParams(location.search).get('k');
      const k = KINDS[q] ? q : 'wedding';
      const K = KINDS[k];
      const $ = id => document.getElementById(id);
      ['makeBtn', 'makeBtn2'].forEach(id => { $(id).href = `make.html?k=${k}`; });
      const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
      const DOC = k === 'wedding' ? '청첩장' : k === 'notice' ? '알림장' : '초대장';
      const josa = (w, a, b) => ((w.charCodeAt(w.length - 1) - 0xac00) % 28 ? a : b);

      // 검색어에 맞춘 제목(송년회 초대장 등)
      const SEO = { yearend: '송년회·연말모임 초대장', newyear: '신년회·새해 모임 초대장', xmas: '크리스마스 파티 초대장', seollal: '설 연휴 가족모임 초대장',
        chuseok: '추석 가족모임 초대장', bungae: '번개 모임 초대장', gather: '모임 초대장', wedding: '모바일 청첩장', notice: '결혼 알림장' };
      document.title = `${SEO[k] || K.name} 만들기 무료 - 게임으로 여는 픽셀 초대장`;
      document.querySelector('meta[name=description]').content = `${K.desc} 가입 없이 무료로 만들어요.`;
      $('kEyebrow').textContent = K.eyebrow;
      $('kName').textContent = K.name;
      $('kDesc').textContent = K.desc;
      (K.uses || []).forEach(t => $('kUses').append(el('li', '', t)));
      (K.points || []).forEach(t => $('kPoints').append(el('li', '', t)));
      const gn = K.game.goodName;
      $('kGame').textContent = `${gn} 받기: 30초 동안 떨어지는 ${gn}${josa(gn, '과', '와')} 하트를 받고 먹구름은 피해요. 화면을 좌우로 밀면 캐릭터가 움직여요. 점수와 상관없이 끝나면 ${DOC}이 열리고, 게임을 건너뛰고 바로 볼 수도 있어요.`;

      // 화면 캡처 3장
      [['오프닝', `캐릭터가 걸어 들어오고 "${K.stage}" 문구가 나와요.`],
       ['미니게임', `${gn} 받기 30초. 건너뛰기 버튼이 항상 있어요.`],
       [DOC, '인사말, 달력, 오시는 길, 계좌가 이어져요.']].forEach(([t, d], i) => {
        const f = el('figure', 'shot');
        const img = el('img');
        img.src = `assets/shots/${k}-${i + 1}.jpg`; img.alt = `${K.name} ${t} 화면`; img.loading = 'lazy';
        const cap = el('figcaption');
        cap.append(el('b', '', `${i + 1}. ${t}`), el('span', '', d));
        f.append(img, cap);
        $('shots').append(f);
      });

      // 만드는 법
      const who = K.people.map(p => p.label).join('·');
      const steps = [
        ['정보 적기', `${K.title ? '모임·행사 이름과 ' : ''}${who} 이름${K.parents ? ', 혼주 표기' : ''}, 연락처를 적어요. 연락처는 비워도 돼요.`],
        ['캐릭터 꾸미기', `옷(${K.outfits.map(o => InviteKinds.OUTFIT_NAMES[o]).join('·')})과 색, 소품(${K.accs.filter(Boolean).map(a => InviteKinds.ACC_NAMES[a]).join('·')}), 머리 모양, 피부색을 골라요. 내 사진 얼굴도 붙일 수 있어요.`],
        [`${K.when}${K.placeOptional ? '' : '와 ' + K.place}`, `${K.placeOptional ? '장소와 시간은 비워도 돼요. ' : ''}주소를 적으면 네이버·카카오 지도 버튼이 자동으로 생겨요.`],
        ['인사말과 계좌', `예시 문구 중 하나를 골라 고쳐 써요. 계좌는 필요할 때만 적어요(${K.accountSides.join('·')}).`],
        ['링크 만들기', '"초대장 링크 만들기"를 누르면 링크가 나와요. 카톡으로 보내고, 수정용 링크는 나만 보는 곳에 저장해 두세요.'],
      ];
      steps.forEach(([t, d]) => { const li = el('li'); li.append(el('b', '', t), el('span', '', d)); $('steps').append(li); });

      // 자주 묻는 질문(+ 검색엔진용 구조화 데이터)
      const faq = [
        ['정말 무료인가요?', '네, 지금은 무료 베타라서 가입 없이 무료로 만들 수 있어요.'],
        ['받는 사람이 앱을 깔아야 하나요?', '아니요. 카톡으로 받은 링크를 누르면 휴대폰 브라우저에서 바로 열려요.'],
        ['게임이 어려우면 어떡하죠?', `게임은 언제든 건너뛸 수 있고, 점수와 상관없이 끝나면 ${DOC}이 열려요.`],
        ['보낸 뒤에 내용을 고칠 수 있나요?', '수정용 링크로 들어가 고친 뒤 새 링크를 다시 보내면 돼요. 이미 보낸 링크는 고치기 전 내용으로 보여요.'],
        ['사진도 넣을 수 있나요?', '무료 베타에서는 사진 대신 픽셀 캐릭터 그림이 들어가요. 사진첩은 준비 중이에요.'],
        ['입력한 정보는 어디에 저장되나요?', '서버에 저장하지 않고 링크 안에만 들어가요. 링크를 가진 사람은 누구나 볼 수 있으니 계좌·연락처는 필요한 것만 적어 주세요.'],
      ];
      faq.forEach(([qq, a]) => { const d = el('details'); d.append(el('summary', '', qq), el('p', '', a)); $('faq').append(d); });
      const ld = document.createElement('script');
      ld.type = 'application/ld+json';
      ld.textContent = JSON.stringify({ '@context': 'https://schema.org', '@type': 'FAQPage',
        mainEntity: faq.map(([qq, a]) => ({ '@type': 'Question', name: qq, acceptedAnswer: { '@type': 'Answer', text: a } })) });
      document.head.append(ld);

      ORDER.filter(x => x !== k).forEach(x => {
        const a = el('a', 'chip', KINDS[x].name);
        a.href = `kind.html?k=${x}`;
        $('others').append(a);
      });

      // 예시 초대장
      const code = await InviteCode.encode(InviteKinds.sampleConfig(k));
      const url = `invite.html?d=${code}`;
      $('exFrame').src = url;
      $('exOpen').href = url;
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>픽셀 초대장 - 게임을 깨면 열리는 재밌는 초대장 만들기</title>
  <meta name="description" content="결혼식·연말 모임·신년 모임·크리스마스 파티·설 연휴 모임·추석 모임·결혼 알림장·번개 모임 등 각종 초대장을 픽셀 캐릭터와 미니게임으로 만들어요. 가입 없이 무료.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="픽셀 초대장">
  <meta property="og:title" content="픽셀 초대장 - 게임을 깨면 열리는 초대장 만들기">
  <meta property="og:description" content="결혼식·모임·행사 초대장을 픽셀 캐릭터와 미니게임으로. 가입 없이 무료.">
  <meta property="og:image" content="https://myolong.github.io/pixel-invite/assets/og/wedding.png">
  <meta name="theme-color" content="#fff3f5">
  <link rel="preload" href="fonts/Galmuri11.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/invite.css?v=20261111p">
  <link rel="stylesheet" href="css/make.css?v=20261111p">
  <link rel="stylesheet" href="css/site.css?v=20261111p">
</head>
<body class="maker">
  <header class="mk-head">
    <a class="mk-home" href="index.html">픽셀 초대장</a>
    <span class="mk-beta">무료 베타</span>
  </header>
  <main class="site">
    <section class="intro">
      <h1>게임을 깨면 열리는<br>재밌는 초대장</h1>
      <p>나를 닮은 픽셀 캐릭터와 30초 미니게임. 받는 사람이 웃으면서 열어보는 초대장을 만들어요. 아래에서 종류를 골라 보세요.</p>
    </section>

    <ul class="kind-cards" id="cards"></ul>

    <section class="mk-card how-card">
      <h2>이렇게 만들어요</h2>
      <ol class="how">
        <li>초대장 종류를 고르고 예시를 봐요</li>
        <li>이름, 날짜, 장소를 적고 캐릭터를 꾸며요</li>
        <li>링크를 만들어 카톡으로 보내면 끝</li>
      </ol>
      <p class="hint">가입이 필요 없고, 입력한 내용은 서버에 저장되지 않고 링크 안에만 들어가요.</p>
    </section>
  </main>

  <script src="js/kinds.js?v=20261111p"></script>
  <script src="js/characters.js?v=20261111p"></script>
  <script src="js/stage.js?v=20261111p"></script>
  <script src="js/scene.js?v=20261111p"></script>
  <script>
    'use strict';
    (async function () {
      const { KINDS, ORDER } = InviteKinds;
      const list = document.getElementById('cards');
      const canvases = [];
      ORDER.forEach(k => {
        const K = KINDS[k];
        const li = document.createElement('li');
        li.innerHTML = `<a class="kind-card" href="kind.html?k=${k}"><canvas aria-hidden="true"></canvas><b></b><small></small><span class="go">예시 보기 ›</span></a>`;
        li.querySelector('b').textContent = K.name;
        li.querySelector('small').textContent = K.blurb;
        list.append(li);
        canvases.push([li.querySelector('canvas'), k]);
      });
      try { await Promise.race([document.fonts.load('700 12px Galmuri11'), new Promise(r => setTimeout(r, 800))]); } catch (e) { /* 무시 */ }
      canvases.forEach(([c, k]) => PixelScene.mount(c, k));
    })();
  </script>
</body>
</html>
